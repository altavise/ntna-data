# Copy to .github/workflows/refresh.yml in the repo that hosts the data.
name: Refresh Data Room datasets

on:
  schedule:
    # 16:00 UTC daily = 10am Chicago in summer, 9am in winter.
    # BLS releases at 08:30 and 10:00 Eastern. In winter 10:00 Eastern is
    # 15:00 UTC, so 16:00 clears the day's releases year round and the Data
    # Room carries the new figures the same morning they come out.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild datasets
        run: node update.js ./data

      # data/status.json changes on every successful run, so there is a commit
      # every day. That is deliberate: it is the heartbeat an outside watcher
      # reads to tell a quiet day from a dead scheduler. The message
      # distinguishes the two, so `git log` stays readable and
      # `git log -- data/laus.json` still shows only real revisions.
      - name: Commit
        run: |
          git config user.name "ntna-data-bot"
          git config user.email "hello@notalentnoalpha.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing staged, not even the heartbeat. That should not happen."
            exit 1
          fi
          if git diff --staged --name-only | grep -qv 'data/status.json'; then
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          else
            git commit -m "Checked, no new figures $(date -u +%Y-%m-%d)"
          fi
          git push
